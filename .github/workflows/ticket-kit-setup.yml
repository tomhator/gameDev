# ticket-kit: 라벨 자동 생성/갱신
# 기본 브랜치에 푸시되면 .github/ticket-kit/labels.json (+ .github/ticket-labels.local.json) 대로 라벨을 맞춘다.
# gh 나 토큰 없이 만든 저장소(템플릿에서 생성, 폰에서 생성)에도 라벨이 생기게 하는 장치. 여러 번 돌아도 안전.
name: ticket-kit-setup
on:
  push:
    branches: [main, master]
    paths: [".github/ticket-kit/labels.json", ".github/ticket-labels.local.json", ".github/workflows/ticket-kit-setup.yml"]
  workflow_dispatch:
permissions:
  issues: write
jobs:
  labels:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const {owner, repo} = context.repo;
            const read = p => fs.existsSync(p) ? JSON.parse(fs.readFileSync(p, 'utf8')) : [];
            const want = [...read('.github/ticket-kit/labels.json'), ...read('.github/ticket-labels.local.json')];
            const have = new Map((await github.paginate(github.rest.issues.listLabelsForRepo, {owner, repo, per_page: 100})).map(l => [l.name, l]));
            let created = 0, updated = 0;
            for (const l of want) {
              const cur = have.get(l.name);
              if (!cur) { await github.rest.issues.createLabel({owner, repo, name: l.name, color: l.color, description: l.description}); created++; }
              else if (cur.color.toUpperCase() !== l.color.toUpperCase() || (cur.description || '') !== l.description) {
                await github.rest.issues.updateLabel({owner, repo, name: l.name, color: l.color, description: l.description}); updated++;
              }
            }
            core.summary.addRaw(`ticket-kit 라벨: 생성 ${created}, 갱신 ${updated}, 총 ${want.length}`).write();
