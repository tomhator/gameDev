<title>gameDev 상황판</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&family=Do+Hyeon&display=swap">
<style>
:root{
  --bg:#F3F5F8; --surface:#FFFFFF; --ink:#1B2430; --muted:#5C6878; --line:#D3DAE3; --line-soft:#E6EBF1;
  --human:#C4741F; --human-soft:#FBF0E2; --claude:#2F6FB5; --claude-soft:#E4EEF9; --done:#3B8A5A; --done-soft:#E3F1E8;
  --mono:"IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace;
  --sans:"IBM Plex Sans KR","Apple SD Gothic Neo","Noto Sans KR",system-ui,sans-serif;
  --display:"Do Hyeon","IBM Plex Sans KR",sans-serif;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#121820; --surface:#1A222C; --ink:#E7ECF2; --muted:#9AA6B5; --line:#2E3946; --line-soft:#232D38;
    --human:#E39A4A; --human-soft:#3A2A16; --claude:#6FA4E0; --claude-soft:#1B2E44; --done:#6CC08E; --done-soft:#1B3325; color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#121820; --surface:#1A222C; --ink:#E7ECF2; --muted:#9AA6B5; --line:#2E3946; --line-soft:#232D38;
  --human:#E39A4A; --human-soft:#3A2A16; --claude:#6FA4E0; --claude-soft:#1B2E44; --done:#6CC08E; --done-soft:#1B3325; color-scheme:dark;
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:14.5px;line-height:1.55}
a{color:inherit;text-decoration:none}
a:hover .t,a.btn:hover{text-decoration:underline}
main{max-width:1040px;margin:0 auto;padding:36px 24px 72px}
header{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:12px 24px;border-bottom:1px solid var(--line);padding-bottom:16px;margin-bottom:28px}
h1{font-family:var(--display);font-size:40px;font-weight:400;margin:0;line-height:1.05}
.snap{font-family:var(--mono);font-size:11.5px;color:var(--muted);margin-top:6px}
.links{display:flex;flex-wrap:wrap;gap:8px}
.links a{font-size:12.5px;padding:5px 11px;border:1px solid var(--line);background:var(--surface);border-radius:3px}
.eyebrow{font-family:var(--mono);font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);margin:0 0 8px;display:flex;align-items:center;gap:10px}
.eyebrow .cnt{font-family:var(--mono);font-size:11px;padding:1px 7px;border-radius:999px;background:var(--line-soft);color:var(--ink);letter-spacing:0}
section{margin:0 0 36px}
/* summary strip */
.strip{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-bottom:28px}
.stat{background:var(--surface);border:1px solid var(--line);padding:12px 14px}
.stat b{display:block;font-size:26px;font-weight:600;line-height:1.1;font-variant-numeric:tabular-nums}
.stat small{color:var(--muted);font-size:12px}
.stat.h b{color:var(--human)} .stat.c b{color:var(--claude)} .stat.d b{color:var(--done)}
/* ticket rows */
.rows{background:var(--surface);border:1px solid var(--line)}
.row{display:grid;grid-template-columns:52px 1fr auto;gap:12px;align-items:center;padding:10px 14px;border-bottom:1px solid var(--line-soft)}
.row:last-child{border-bottom:0}
.row .n{font-family:var(--mono);font-size:12px;color:var(--muted)}
.row .t{font-weight:500}
.row .meta{display:flex;gap:6px;align-items:center;flex-wrap:wrap;margin-top:3px}
.row .age{font-family:var(--mono);font-size:11px;color:var(--muted);white-space:nowrap}
.empty{padding:16px 14px;color:var(--muted);font-size:13px}
.chip{font-family:var(--mono);font-size:10.5px;padding:1px 7px;border-radius:999px;border:1px solid var(--line);background:var(--bg);white-space:nowrap}
.chip.h{border-color:var(--human);color:var(--human);background:var(--human-soft)}
.chip.c{border-color:var(--claude);color:var(--claude);background:var(--claude-soft)}
.chip.p{border-style:dashed}
.chip.ms{color:var(--muted)}
.row.hot .t::before{content:"★ ";color:var(--human)}
/* project cards */
.cards{display:grid;grid-template-columns:repeat(2,1fr);gap:14px}
.card{background:var(--surface);border:1px solid var(--line);padding:16px 18px;display:flex;flex-direction:column;gap:12px}
.card.parked{opacity:.72}
.card .head{display:flex;justify-content:space-between;align-items:flex-start;gap:10px}
.card h3{margin:0;font-size:17px;font-weight:600;font-family:var(--mono)}
.card .desc{color:var(--muted);font-size:12.5px;margin-top:2px}
.stage{font-size:11px;padding:2px 8px;border-radius:2px;background:var(--line-soft);color:var(--muted);white-space:nowrap}
.counts{display:flex;gap:14px;font-size:12.5px;color:var(--muted);font-variant-numeric:tabular-nums}
.counts b{font-weight:600;color:var(--ink)} .counts .h b{color:var(--human)} .counts .c b{color:var(--claude)}
.ms{display:flex;flex-direction:column;gap:6px}
.ms .one{display:grid;grid-template-columns:1fr auto;gap:8px;font-size:12px;align-items:center}
.ms .bar{grid-column:1/-1;height:6px;background:var(--line-soft);border-radius:3px;overflow:hidden}
.ms .bar i{display:block;height:100%;background:var(--done)}
.ms .none{font-size:12px;color:var(--muted)}
.last{font-size:12px;color:var(--muted)}
.throw{display:flex;flex-wrap:wrap;gap:6px;border-top:1px solid var(--line-soft);padding-top:12px;margin-top:auto}
.throw span{font-size:11.5px;color:var(--muted);align-self:center;margin-right:2px}
a.btn{font-size:12px;padding:4px 9px;border:1px solid var(--line);border-radius:3px;background:var(--bg)}
a.btn.h{border-color:var(--human)} a.btn.c{border-color:var(--claude)}
footer{margin-top:40px;font-size:12.5px;color:var(--muted);border-top:1px solid var(--line);padding-top:14px;max-width:70ch}
@media (max-width:720px){.strip{grid-template-columns:repeat(2,1fr)}.cards{grid-template-columns:1fr}.row{grid-template-columns:44px 1fr}.row .age{grid-column:2}}
</style>
<main>
  <header>
    <div><h1 id="title"></h1><div class="snap" id="snap"></div></div>
    <nav class="links" id="links"></nav>
  </header>
  <div class="strip" id="strip"></div>
  <section><p class="eyebrow">당신 코트 · 지금 할 일 <span class="cnt" id="cnt-h"></span></p><div class="rows" id="human"></div></section>
  <section><p class="eyebrow">프로젝트</p><div class="cards" id="cards"></div></section>
  <section><p class="eyebrow">Claude 코트 · 진행 중 <span class="cnt" id="cnt-c"></span></p><div class="rows" id="claude"></div></section>
  <section><p class="eyebrow">최근 닫힘 <span class="cnt" id="cnt-d"></span></p><div class="rows" id="done"></div></section>
  <footer id="foot"></footer>
</main>
<script id="data" type="application/json">__DATA__</script>
<script>
const D = JSON.parse(document.getElementById('data').textContent);
const $ = id => document.getElementById(id);
const esc = s => String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const KIND_ICON = {idea:'💡', bug:'🐛', tuning:'🎚', feature:'🧩', decision:'⚖️', playtest:'🎮', question:'❓'};
const HOT = {decision: 0, playtest: 1, question: 2};
const projLabels = D.projects.map(p => p.label).filter(Boolean);
const projOf = i => i.labels.find(l => projLabels.includes(l)) || null;

function ago(iso){
  const ms = Date.now() - new Date(iso).getTime(), m = Math.round(ms/60000), h = Math.round(m/60), d = Math.round(h/24);
  if (m < 60) return `${Math.max(m,1)}분 전`; if (h < 48) return `${h}시간 전`; return `${d}일 전`;
}
function fmtSnap(iso){
  const t = new Date(iso);
  return `${t.getFullYear()}-${String(t.getMonth()+1).padStart(2,'0')}-${String(t.getDate()).padStart(2,'0')} ${String(t.getHours()).padStart(2,'0')}:${String(t.getMinutes()).padStart(2,'0')} 기준 스냅샷 · ${ago(iso)} 갱신`;
}
function chips(i, withProject=true){
  let h = '';
  if (i.kind) h += `<span class="chip">${KIND_ICON[i.kind]||''} ${i.kind}</span>`;
  const p = projOf(i); if (withProject && p) h += `<span class="chip p">${esc(p)}</span>`;
  if (i.milestone) h += `<span class="chip ms">${esc(i.milestone)}</span>`;
  if (i.comments) h += `<span class="chip ms">💬 ${i.comments}</span>`;
  return h;
}
function rows(el, list, opts={}){
  if (!list.length){ el.innerHTML = `<div class="empty">${opts.empty || '없음'}</div>`; return; }
  el.innerHTML = list.map(i => `<a class="row ${opts.hot && i.kind in HOT ? 'hot':''}" href="${i.url}" target="_blank" rel="noopener">
    <span class="n">#${i.n}</span>
    <span><div class="t">${esc(i.title)}</div><div class="meta">${chips(i)}</div></span>
    <span class="age">${opts.closed ? '닫힘 ' + ago(i.closed) : ago(i.updated)}</span></a>`).join('');
}
function newIssueUrl(form, projLabel){
  const labels = [...form.labels]; if (projLabel) labels.push(projLabel);
  const title = form.title + (projLabel ? projLabel + ': ' : '');
  const q = new URLSearchParams({template: form.file, labels: labels.join(','), title});
  return `https://github.com/${D.repo}/issues/new?${q}`;
}
function throwRow(projLabel){
  return `<div class="throw"><span>티켓 던지기</span>` + D.forms.map(f => {
    const court = f.labels.includes('needs-human') ? 'h' : 'c';
    const short = f.name.replace(/\s*\(.*\)\s*$/, '');
    return `<a class="btn ${court}" href="${newIssueUrl(f, projLabel)}" target="_blank" rel="noopener" title="${esc(f.name)}">${esc(short)}</a>`;
  }).join('') + `</div>`;
}

// header
$('title').textContent = D.title; document.title = D.title;
$('snap').textContent = fmtSnap(D.snapshot);
$('links').innerHTML = [
  [`https://github.com/${D.repo}/issues/assigned/@me`, 'Assigned to me'],
  [`https://github.com/${D.repo}/issues`, '모든 이슈'],
  [`https://github.com/${D.repo}/projects`, 'Projects 보드'],
  [`https://github.com/${D.repo}/milestones`, '마일스톤'],
].map(([u,t]) => `<a href="${u}" target="_blank" rel="noopener">${t}</a>`).join('');

// lists
const open = D.issues.filter(i => i.state === 'open');
const human = open.filter(i => i.court === 'needs-human').sort((a,b) => (HOT[a.kind]??9)-(HOT[b.kind]??9) || a.updated.localeCompare(b.updated));
const claude = open.filter(i => i.court === 'needs-claude').sort((a,b) => b.updated.localeCompare(a.updated));
const orphan = open.filter(i => !i.court);
const done = D.issues.filter(i => i.state === 'closed').sort((a,b) => (b.closed||'').localeCompare(a.closed||'')).slice(0,10);
const week = Date.now() - 7*86400e3;
$('strip').innerHTML = `
  <div class="stat h"><b>${human.length}</b><small>당신 코트</small></div>
  <div class="stat c"><b>${claude.length}</b><small>Claude 코트</small></div>
  <div class="stat"><b>${open.length}</b><small>열린 티켓 전체${orphan.length ? ` · 코트 없음 ${orphan.length}` : ''}</small></div>
  <div class="stat d"><b>${D.issues.filter(i => i.closed && new Date(i.closed).getTime() > week).length}</b><small>이번 주 닫힘</small></div>`;
$('cnt-h').textContent = human.length; $('cnt-c').textContent = claude.length; $('cnt-d').textContent = done.length;
rows($('human'), human, {hot:true, empty:'비어 있음. 구경꾼 모드 — Claude가 곧 뭔가 던질 것'});
rows($('claude'), claude, {empty:'비어 있음. 티켓을 던져 주세요'});
rows($('done'), done, {closed:true, empty:'아직 닫힌 티켓 없음'});

// project cards
$('cards').innerHTML = D.projects.map(p => {
  const mine = p.label ? open.filter(i => i.labels.includes(p.label)) : open;
  const all = p.label ? D.issues.filter(i => i.labels.includes(p.label)) : D.issues;
  const h = mine.filter(i => i.court === 'needs-human').length, c = mine.filter(i => i.court === 'needs-claude').length;
  const ms = D.milestones.filter(m => !p.label || m.title.startsWith(p.label + ':') || m.title.startsWith(p.label + ' '));
  const last = all.map(i => i.updated).sort().pop();
  const parked = /보류/.test(p.stage || '');
  const msHtml = ms.length ? ms.map(m => { const tot = m.open + m.closed, pct = tot ? Math.round(m.closed/tot*100) : 0;
      return `<div class="one"><a href="${m.url}" target="_blank" rel="noopener">${esc(m.title.replace(p.label + ':', '').trim())}</a><span>${m.closed}/${tot} · ${pct}%</span><div class="bar"><i style="width:${pct}%"></i></div></div>`; }).join('')
    : `<div class="none">마일스톤 없음</div>`;
  return `<div class="card ${parked ? 'parked':''}">
    <div class="head"><div><h3>${esc(p.name)}</h3><div class="desc">${esc(p.desc||'')}</div></div><span class="stage">${esc(p.stage||'')}</span></div>
    <div class="counts"><span class="h"><b>${h}</b> 당신</span><span class="c"><b>${c}</b> Claude</span><span><b>${mine.length}</b> 열림</span><span><b>${all.length - mine.length}</b> 닫힘</span></div>
    <div class="ms">${msHtml}</div>
    <div class="last">마지막 움직임 ${last ? ago(last) : '없음'}</div>
    ${throwRow(p.label)}
  </div>`;
}).join('');

$('foot').innerHTML = `이 화면은 Claude가 세션을 시작하고 끝낼 때 GitHub에서 다시 읽어 갱신합니다. 그 사이의 변화는 <a href="https://github.com/${D.repo}/issues" target="_blank" rel="noopener"><u>GitHub 이슈</u></a>가 정확합니다. "티켓 던지기" 버튼은 GitHub 이슈 폼을 템플릿·라벨이 채워진 채로 엽니다. 주황 테두리는 당신 코트로, 파랑 테두리는 Claude 코트로 가는 티켓입니다.`;
</script>
