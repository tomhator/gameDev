name: "💡 아이디어"
description: "떠오른 것. 한 줄이어도 된다. 48시간 식힌 뒤 리트머스."
title: "[idea] "
labels: ["idea", "needs-claude"]
body:
  - type: textarea
    id: what
    attributes:
      label: 한 줄
      description: 뭐가 있으면 좋겠나
    validations:
      required: true
  - type: textarea
    id: why
    attributes:
      label: 왜 (선택)
      description: 어떤 순간이 더 재밌어지나. 모르면 비워도 됨
  - type: dropdown
    id: size
    attributes:
      label: 대충 크기
      options:
        - 모름
        - 작음 (한 세션)
        - 중간 (며칠)
        - 큼 (스코프 헌법 확인 필요)
      default: 0
