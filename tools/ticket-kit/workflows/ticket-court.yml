# ticket-kit: 코트 라벨 + 단계 라벨 + 동시 진행 제한(WIP)
# - needs-human / needs-claude 는 서로 배타적 (하나 붙이면 다른 하나 자동 제거)
# - needs-human 이 붙으면 저장소 소유자에게 할당 → 폰 알림 + "Assigned to me" 필터가 곧 내 할 일
# - needs-claude 로 넘어가면 할당 해제
# - stage:idea → spec → build → test → art → verify 도 서로 배타적 (하나 붙이면 나머지 제거)
# - 단계별 동시 진행 상한을 넘기면 그 티켓에 wip-over 라벨 + 경고 댓글. 자리가 비면 자동으로 뗀다
name: ticket-court
on:
  issues:
    types: [labeled, unlabeled, opened, closed, reopened]
permissions:
  issues: write
jobs:
  court:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/github-script@v7
        with:
          script: |
            const {owner, repo} = context.repo;
            const issue = context.payload.issue;
            const number = issue.number;
            const action = context.payload.action;
            const added = action === 'labeled' ? context.payload.label.name : null;

            const HUMAN = 'needs-human', CLAUDE = 'needs-claude', OVER = 'wip-over';
            const STAGES = ['stage:idea', 'stage:spec', 'stage:build', 'stage:test', 'stage:art', 'stage:verify'];
            const STAGE_NAME = {'stage:idea': '아이디어', 'stage:spec': '기획', 'stage:build': '구현',
                                'stage:test': '테스트', 'stage:art': '아트', 'stage:verify': '검수'};
            // 동시 진행 제한 (#31). 자리가 없으면 앞의 것을 끝내거나 닫는다.
            const PER_STAGE_LIMIT = {'stage:idea': 5, 'stage:build': 1, 'stage:art': 1};
            const ACTIVE = ['stage:spec', 'stage:build', 'stage:test', 'stage:art', 'stage:verify'];
            const ACTIVE_LIMIT = 3;

            let labels = issue.labels.map(l => l.name);
            const has = n => labels.includes(n);
            const rm = async (n, num = number) => {
              await github.rest.issues.removeLabel({owner, repo, issue_number: num, name: n}).catch(() => {});
              if (num === number) labels = labels.filter(x => x !== n);
            };
            const add = async (n, num = number) => {
              await github.rest.issues.addLabels({owner, repo, issue_number: num, labels: [n]}).catch(() => {});
              if (num === number && !labels.includes(n)) labels.push(n);
            };

            // 1. 코트 — 배타 + 자동 할당
            let court = null;
            if (added === HUMAN || (action === 'opened' && has(HUMAN) && !has(CLAUDE))) court = HUMAN;
            if (added === CLAUDE || (action === 'opened' && has(CLAUDE) && !has(HUMAN))) court = CLAUDE;
            if (court === HUMAN) {
              await rm(CLAUDE);
              await github.rest.issues.addAssignees({owner, repo, issue_number: number, assignees: [owner]}).catch(() => {});
            } else if (court === CLAUDE) {
              await rm(HUMAN);
              const assigned = issue.assignees.map(a => a.login);
              if (assigned.includes(owner))
                await github.rest.issues.removeAssignees({owner, repo, issue_number: number, assignees: [owner]}).catch(() => {});
            }

            // 2. 단계 — 배타. 새로 붙은 단계만 남기고 나머지를 뗀다
            if (added && STAGES.includes(added))
              for (const s of STAGES) if (s !== added && has(s)) await rm(s);

            // 3. 동시 진행 제한 — 열린 티켓 전체를 다시 세고, 넘친 티켓에 wip-over 를 붙인다
            const all = await github.paginate(github.rest.issues.listForRepo, {owner, repo, state: 'open', per_page: 100});
            const items = all.filter(i => !i.pull_request).map(i =>
              i.number === number ? {n: number, labels} : {n: i.number, labels: i.labels.map(l => l.name)});
            // 닫히는 중이면 이 티켓은 이미 자리를 비운 것으로 센다
            const live = (action === 'closed') ? items.filter(it => it.n !== number) : items;

            const stageOf = it => STAGES.find(s => it.labels.includes(s)) || null;
            const inStage = s => live.filter(it => stageOf(it) === s);
            const activeItems = live.filter(it => ACTIVE.includes(stageOf(it)));

            // 넘친 범위와, 그 범위에 속한 티켓 번호
            const overScopes = [];
            for (const [s, lim] of Object.entries(PER_STAGE_LIMIT)) {
              const inIt = inStage(s);
              if (inIt.length > lim)
                overScopes.push({text: `${STAGE_NAME[s]}(\`${s}\`) ${inIt.length}/${lim}`, members: inIt.map(it => it.n)});
            }
            if (activeItems.length > ACTIVE_LIMIT)
              overScopes.push({text: `진행 중(기획~검수 합계) ${activeItems.length}/${ACTIVE_LIMIT}`, members: activeItems.map(it => it.n)});

            const overNums = new Set(overScopes.flatMap(o => o.members));

            // 자리가 다시 비었으면 뗀다. 닫힌 티켓에서도 뗀다(목록에 안 잡히므로 따로)
            for (const it of items)
              if (it.labels.includes(OVER) && !overNums.has(it.n)) await rm(OVER, it.n);
            if (action === 'closed' && has(OVER)) await rm(OVER);

            // 넘쳤으면 방금 움직인 티켓에 표시하고 한 번만 경고한다
            if (overNums.has(number) && !has(OVER)) {
              const my = overScopes.filter(o => o.members.includes(number));
              const lines = my.map(o => `> - ${o.text} — 함께 있는 티켓: ${o.members.map(n => '#' + n).join(', ')}`).join('\n');
              await add(OVER);
              await github.rest.issues.createComment({owner, repo, issue_number: number, body:
                `> [!WARNING]\n> **동시 진행 제한 초과**\n${lines}\n>\n` +
                `> 자리가 없으면 앞의 것을 끝내거나 닫는다. 이 티켓을 앞 단계로 되돌리거나, 같은 범위의 다른 티켓을 비워라.\n\n` +
                `_ticket-kit / ticket-court_`}).catch(() => {});
            }
